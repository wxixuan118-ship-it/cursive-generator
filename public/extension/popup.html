<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cursive Text Generator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --surface: #f5f5f0;
      --border: #e2e2da;
      --ink: #1a1a18;
      --muted: #888880;
      --sage: #2f6b4f;
      --sage-light: rgba(47,107,79,.1);
      --radius: 9px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a18;
        --surface: #252520;
        --border: #333330;
        --ink: #f0f0ea;
        --muted: #8a8a80;
        --sage-light: rgba(47,107,79,.18);
      }
    }

    body {
      width: 360px;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px 10px;
      border-bottom: 1px solid var(--border);
    }
    .header-icon { font-size: 18px; }
    .header-title { font-weight: 700; font-size: 14px; letter-spacing: -.01em; }
    .header-site {
      margin-left: auto;
      font-size: 11px;
      color: var(--sage);
      text-decoration: none;
      font-weight: 600;
    }
    .header-site:hover { text-decoration: underline; }

    /* ── Input ── */
    .input-wrap { padding: 12px 14px 0; }
    textarea#input {
      width: 100%;
      height: 64px;
      resize: none;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      font-family: inherit;
      font-size: 15px;
      padding: 8px 10px;
      line-height: 1.5;
      outline: none;
      transition: border-color .15s;
    }
    textarea#input:focus { border-color: var(--sage); }
    textarea#input::placeholder { color: var(--muted); }

    /* ── Primary output ── */
    .primary {
      margin: 10px 14px 0;
      background: var(--sage-light);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px 8px;
    }
    .primary-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .primary-out {
      font-size: 26px;
      line-height: 1.35;
      color: var(--ink);
      word-break: break-all;
      min-height: 36px;
    }

    /* ── Style pills ── */
    .styles {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      padding: 10px 14px 0;
    }
    .style-pill {
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 600;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: background .12s, color .12s, border-color .12s;
      white-space: nowrap;
    }
    .style-pill:hover { border-color: var(--sage); color: var(--sage); }
    .style-pill.active { background: var(--sage); color: #fff; border-color: var(--sage); }

    /* ── Actions ── */
    .actions {
      display: flex;
      gap: 7px;
      padding: 10px 14px;
    }
    .btn-copy {
      flex: 1;
      padding: 8px 0;
      font-size: 14px;
      font-weight: 700;
      background: var(--sage);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn-copy:hover { opacity: .88; }
    .btn-copy.done { background: #1e8449; }
    .btn-dl {
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: background .12s, color .12s;
      white-space: nowrap;
    }
    .btn-dl:hover { background: var(--surface); color: var(--ink); }

    /* ── All styles grid ── */
    .all-styles {
      border-top: 1px solid var(--border);
      padding: 10px 14px 12px;
    }
    .all-styles-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
      margin-bottom: 7px;
    }
    .style-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .style-row:last-child { border-bottom: none; }
    .style-row:hover { background: var(--sage-light); margin: 0 -4px; padding: 5px 4px; border-radius: 6px; border-bottom-color: transparent; }
    .style-row-name {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
      width: 80px;
      flex-shrink: 0;
    }
    .style-row-out {
      flex: 1;
      font-size: 16px;
      color: var(--ink);
      word-break: break-all;
    }
    .style-row-copy {
      font-size: 10px;
      font-weight: 700;
      color: var(--sage);
      flex-shrink: 0;
      opacity: 0;
      transition: opacity .12s;
    }
    .style-row:hover .style-row-copy { opacity: 1; }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-icon">𝒞</span>
    <span class="header-title">Cursive Text Generator</span>
    <a class="header-site" href="https://www.cursive-text-generator.net/" target="_blank">Open site →</a>
  </div>

  <div class="input-wrap">
    <textarea id="input" placeholder="Type anything here…" spellcheck="false" autocomplete="off"></textarea>
  </div>

  <div class="primary">
    <div class="primary-label" id="primary-label">Bold Cursive</div>
    <div class="primary-out" id="primary-out"></div>
  </div>

  <div class="styles" id="styles"></div>

  <div class="actions">
    <button class="btn-copy" id="btn-copy">Copy</button>
    <button class="btn-dl" id="btn-dl">↓ PNG</button>
  </div>

  <div class="all-styles">
    <div class="all-styles-label">All styles — click to copy</div>
    <div id="all-rows"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
